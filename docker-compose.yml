services:
  app:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      - my-redis
    volumes:
      - ./my_logs:/app/logs
    restart: unless-stopped

  my-redis:
    image: redis:7-alpine
    volumes:
      - redis_storage:/data
    restart: unless-stopped

volumes:
  redis_storage:
